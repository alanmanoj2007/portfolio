    <script type="text/babel">
        const { useState, useEffect, useRef, createContext, useContext } = React;
        const ThemeContext = createContext();

        // Canvas element for rendering optimized ambient dots
        function ParticleBackground() {
            const canvasRef = useRef(null);
            const { darkMode } = useContext(ThemeContext);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let particles = [];

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', resize);
                resize();

                class Particle {
                    constructor() {
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        this.size = Math.random() * 2 + 0.5;
                        this.speedX = (Math.random() - 0.5) * 0.3;
                        this.speedY = (Math.random() - 0.5) * 0.3;
                    }
                    update() {
                        this.x += this.speedX;
                        this.y += this.speedY;
                        if (this.x > canvas.width) this.x = 0;
                        if (this.x < 0) this.x = canvas.width;
                        if (this.y > canvas.height) this.y = 0;
                        if (this.y < 0) this.y = canvas.height;
                    }
                    draw() {
                        ctx.fillStyle = darkMode ? 'rgba(6, 182, 212, 0.15)' : 'rgba(37, 99, 235, 0.1)';
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                for (let i = 0; i < 60; i++) particles.push(new Particle());

                const render = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => { p.update(); p.draw(); });
                    animationFrameId = requestAnimationFrame(render);
                };
                render();

                return () => {
                    window.removeEventListener('resize', resize);
                    cancelAnimationFrame(animationFrameId);
                };
            }, [darkMode]);

            return <canvas id="particle-canvas" ref={canvasRef} />;
        }

        // Structural viewport observer for animations
        function ScrollReveal({ children }) {
            const [reveal, setReveal] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setReveal(true);
                        observer.unobserve(ref.current);
                    }
                }, { threshold: 0.1 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

            return (
                <div ref={ref} className={`transition-all duration-1000 transform ${reveal ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`}>
                    {children}
                </div>
            );
        }

        // Dynamic Data Consumer Hook
        function useGitHubRepos(username) {
            const [repos, setRepos] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(false);

            useEffect(() => {
                fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=6`)
                    .then(res => {
                        if (!res.ok) throw new Error();
                        return res.json();
                    })
                    .then(data => {
                        setRepos(data);
                        setLoading(false);
                    })
                    .catch(() => {
                        setError(true);
                        setLoading(false);
                    });
            }, [username]);

            return { repos, loading, error };
        }

        function HeroSection() {
            const titles = [
                "Computer Science Engineering Student",
                "Web Developer",
                "Creative Designer",
                "IEEE CASS Kerala SLT Member",
                "μLearn Creative Team Member"
            ];
            const [index, setIndex] = useState(0);
            const [subText, setSubText] = useState('');
            const [isDeleting, setIsDeleting] = useState(false);

            useEffect(() => {
                let timer;
                const fullText = titles[index];
                
                if (isDeleting) {
                    timer = setTimeout(() => {
                        setSubText(fullText.substring(0, subText.length - 1));
                    }, 40);
                } else {
                    timer = setTimeout(() => {
                        setSubText(fullText.substring(0, subText.length + 1));
                    }, 80);
                }

                if (!isDeleting && subText === fullText) {
                    timer = setTimeout(() => setIsDeleting(true), 1800);
                } else if (isDeleting && subText === '') {
                    setIsDeleting(false);
                    setIndex((index + 1) % titles.length);
                }

                return () => clearTimeout(timer);
            }, [subText, isDeleting, index]);

            return (

                            </div>
                        </div>

            );
