    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

        const ThemeContext = createContext();
        const useTheme = () => useContext(ThemeContext);

        function useTypingAnimation(strings, typingSpeed = 80, deletingSpeed = 40, pauseTime = 2000) {
            const [displayText, setDisplayText] = useState('');
            const [stringIndex, setStringIndex] = useState(0);
            const [charIndex, setCharIndex] = useState(0);
            const [isDeleting, setIsDeleting] = useState(false);
            const [isPaused, setIsPaused] = useState(false);

            useEffect(() => {
                const currentString = strings[stringIndex];
                let timeout;

                if (isPaused) {
                    timeout = setTimeout(() => {
                        setIsPaused(false);
                        setIsDeleting(true);
                    }, pauseTime);
                } else if (isDeleting) {
                    if (charIndex > 0) {
                        timeout = setTimeout(() => {
                            setCharIndex(prev => prev - 1);
                        }, deletingSpeed);
                    } else {
                        setIsDeleting(false);
                        setStringIndex(prev => (prev + 1) % strings.length);
                    }
                } else {
                    if (charIndex < currentString.length) {
                        timeout = setTimeout(() => {
                            setCharIndex(prev => prev + 1);
                        }, typingSpeed);
                    } else {
                        setIsPaused(true);
                    }
                }

                setDisplayText(currentString.substring(0, charIndex));
                return () => clearTimeout(timeout);
            }, [charIndex, isDeleting, isPaused, stringIndex, strings, typingSpeed, deletingSpeed, pauseTime]);

            return displayText;
        }

        function useScrollReveal(threshold = 0.15) {
            const ref = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.unobserve(entry.target);
                        }
                    }, { threshold, rootMargin: '0px 0px -40px 0px' }
                );

                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, [threshold]);

            return [ref, isVisible];
        }

        function useGitHubRepos(username) {
            const [repos, setRepos] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                const fetchRepos = async() => {
                    try {
                        const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=6`);
                        if (!response.ok) throw new Error('Failed to fetch repos');
                        const data = await response.json();
                        const filtered = data.map(repo => ({
                            id: repo.id,
                            name: repo.name,
                            description: repo.description || 'No description available',
                            html_url: repo.html_url,
                            homepage: repo.homepage || null,
                            language: repo.language || 'N/A',
                            stargazers_count: repo.stargazers_count,
                            topics: repo.topics || [],
                            updated_at: repo.updated_at,
                        }));
                        setRepos(filtered);
                    } catch (err) {
                        setError(err.message);
                    } finally {
                        setLoading(false);
                    }
                };
                fetchRepos();
            }, [username]);

            return { repos, loading, error };
        }

        function ParticleBackground() {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let particles = [];

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };

                class Particle {
                    constructor() {
                        this.reset();
                    }
                    reset() {
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        this.size = Math.random() * 2 + 0.5;
                        this.speedX = (Math.random() - 0.5) * 0.4;
                        this.speedY = (Math.random() - 0.5) * 0.4;
                        this.opacity = Math.random() * 0.5 + 0.1;
                        this.color = ['#4f7fff', '#8b5cf6', '#22d3ee'][Math.floor(Math.random() * 3)];
                    }
                    update() {
                        this.x += this.speedX;
                        this.y += this.speedY;
                        if (this.x < -10 || this.x > canvas.width + 10 || this.y < -10 || this.y > canvas.height + 10) {
                            this.reset();
                        }
                    }
                    draw(ctx) {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fillStyle = this.color;
                        ctx.globalAlpha = this.opacity;
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    }
                }

                const init = () => {
                    particles = [];
                    const count = Math.min(80, Math.floor((canvas.width * canvas.height) / 12000));
                    for (let i = 0; i < count; i++) {
                        particles.push(new Particle());
                    }
                };

                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        p.update();
                        p.draw(ctx);
                    });
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 140) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = 'rgba(79,127,255,0.06)';
                                ctx.lineWidth = 0.5;
                                ctx.stroke();
                            }
                        }
                    }
                    animationFrameId = requestAnimationFrame(animate);
                };

                resize();
                init();
                animate();
                window.addEventListener('resize', () => {
                    resize();
                    init();
                });

                return () => {
                    cancelAnimationFrame(animationFrameId);
                    window.removeEventListener('resize', resize);
                };
            }, []);

            return <canvas ref={canvasRef} id="particle-canvas" />;
        }

        function ContactSection() {
            const [formData, setFormData] = useState({ name: '', email: '', message: '' });

            const [copied, setCopied] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
                setTimeout(() => setSubmitted(false), 3000);
                setFormData({ name: '', email: '', message: '' });
            };

            const copyToClipboard = (text, label) => {
                navigator.clipboard.writeText(text).then(() => {
                    setCopied(label);
                    setTimeout(() => setCopied(''), 2000);
                });
            };

            return (
                <section id="contact" className="py-16 md:py-24">

                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        function BackToTop() {
            const [visible, setVisible] = useState(false);

            useEffect(() => {
                const handleScroll = () => setVisible(window.scrollY > 500);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

            if (!visible) return null;

            return (
                <button onClick={scrollToTop} className="fixed bottom-6 right-6 w-11 h-11 rounded-full glass-card flex items-center justify-center text-lg hover:border-[rgba(79,127,255,0.5)] transition-all z-40 cursor-pointer shadow-lg" aria-label="Back to top">
                    ↑
                </button>
            );
        }

        function App() {
            const [darkMode, setDarkMode] = useState(true);

            useEffect(() => {
                document.body.classList.toggle('light', !darkMode);
                const root = document.documentElement;
                if (darkMode) {
                    root.style.setProperty('--bg', '#06060f');
                    root.style.setProperty('--card', '#0d0d1f');
                    root.style.setProperty('--text', '#e2e8f0');
                    root.style.setProperty('--text-secondary', '#94a3b8');
                    root.style.setProperty('--glass', 'rgba(255,255,255,0.03)');
                    root.style.setProperty('--glass-border', 'rgba(255,255,255,0.06)');
                    root.style.setProperty('--glass-hover', 'rgba(255,255,255,0.06)');
                } else {
                    root.style.setProperty('--bg', '#f8fafc');
                    root.style.setProperty('--card', '#ffffff');
                    root.style.setProperty('--text', '#1e293b');
                    root.style.setProperty('--text-secondary', '#64748b');
                    root.style.setProperty('--glass', 'rgba(0,0,0,0.02)');
                    root.style.setProperty('--glass-border', 'rgba(0,0,0,0.08)');
                    root.style.setProperty('--glass-hover', 'rgba(0,0,0,0.04)');
                }
            }, [darkMode]);

            const toggleDarkMode = () => setDarkMode(prev => !prev);

            return (
                <ThemeContext.Provider value={{ darkMode, toggleDarkMode }}>
                    <ParticleBackground />
                    <Navbar darkMode={darkMode} toggleDarkMode={toggleDarkMode} />
                    <main>
                        <HeroSection />
                        <AboutSection />
                        <EducationSection />
                        <SkillsSection />
                        <ProjectsSection />
                        <ExperienceSection />
                        <AchievementsSection />
                        <ContactSection />
                    </main>
                    <Footer />
                    <BackToTop />
                </ThemeContext.Provider>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<App />);
    </script>
